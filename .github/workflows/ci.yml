name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXTAUTH_SECRET: ci-secret-not-for-real-use
  NEXTAUTH_URL: http://localhost:3000
  GEMINI_API_KEY: ci-key-unused

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    # Postgres, not SQLite — this is the authoritative check that the
    # schema/queries actually work on the engine production uses. Local
    # `npm test` runs against SQLite for zero-setup iteration; this job is
    # what catches anything that diverges between the two engines.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devweekends
          POSTGRES_PASSWORD: devweekends
          POSTGRES_DB: devweekends_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://devweekends:devweekends@localhost:5432/devweekends_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/swap-datasource.js postgresql
      - run: npx prisma generate
      - run: npx prisma db push --accept-data-loss
      - run: npx vitest run --no-file-parallelism
        env:
          # Override .env.test's SQLite URL with this job's Postgres one.
          DATABASE_URL: postgresql://devweekends:devweekends@localhost:5432/devweekends_test

  build:
    runs-on: ubuntu-latest
    env:
      # prisma generate reads the schema only; no live DB connection is
      # needed at build time (data pages are all forced-dynamic by session
      # checks), so a placeholder URL is fine here.
      DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
